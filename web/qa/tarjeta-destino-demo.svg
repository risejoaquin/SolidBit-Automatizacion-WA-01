<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="emboss" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="0.5" flood-color="#0369a1" flood-opacity="0.9"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation="0.5" flood-color="#ffffff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Body -->
  <rect x="25" y="25" width="750" height="450" rx="28" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="2"/>

  <!-- Warning Banner at Top for Safety & Contract Verification -->
  <rect x="25" y="25" width="750" height="38" rx="28" fill="#dc2626" opacity="0.95"/>
  <rect x="25" y="45" width="750" height="18" fill="#dc2626" opacity="0.95"/>
  <text x="400" y="47" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">
    CUENTA DE PRUEBA — NO REAL — NO TRANSFERIR
  </text>

  <!-- Globe Line Art Behind Chip -->
  <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.65" transform="translate(60, 80)">
    <circle cx="80" cy="80" r="70"/>
    <ellipse cx="80" cy="80" rx="35" ry="70"/>
    <line x1="10" y1="80" x2="150" y2="80"/>
    <line x1="22" y1="45" x2="138" y2="45"/>
    <line x1="22" y1="115" x2="138" y2="115"/>
  </g>

  <!-- Title / Logo on Top Right -->
  <text x="710" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" text-anchor="end" letter-spacing="1">
    Mr. Burger
  </text>
  <text x="710" y="175" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="end" letter-spacing="2">
    TARJETA DE PRUEBA
  </text>

  <!-- Chip -->
  <rect x="80" y="180" width="85" height="65" rx="12" fill="url(#chipGrad)" stroke="#a16207" stroke-width="1.5"/>
  <path d="M80,212 L120,212 M125,180 L125,245 M130,212 L165,212 M95,180 C95,200 95,200 80,202 M95,245 C95,224 95,224 80,222 M150,180 C150,200 150,200 165,202 M150,245 C150,224 150,224 165,222" fill="none" stroke="#854d0e" stroke-width="1.8"/>

  <!-- Card Number (Embossed look) -->
  <text x="80" y="315" fill="#e0f2fe" font-family="'Courier New', Courier, monospace" font-size="44" font-weight="bold" letter-spacing="6" filter="url(#emboss)">
    0000  0000  0000  0000
  </text>

  <!-- Card Holder Name (MR. BURGER embossed at bottom) -->
  <text x="80" y="405" fill="#e0f2fe" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="bold" letter-spacing="4" filter="url(#emboss)">
    MR. BURGER
  </text>

  <!-- Small Footer Badge on Bottom Right -->
  <rect x="610" y="365" width="125" height="55" rx="12" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.8"/>
  <text x="672" y="392" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" filter="url(#emboss)">
    SOLIDBIT
  </text>
  <text x="672" y="410" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    QA DEMO
  </text>
</svg>